<div class="min-h-screen bg-background text-foreground">
  <header class="border-b border-border bg-background">
    <div
      class="mx-auto flex w-full max-w-7xl flex-col gap-4 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8"
    >
      <span class="text-lg font-semibold tracking-tight">Orquestra</span>
      <nav aria-label="Navegação principal">
        <ul class="flex flex-wrap gap-2">
          <li>
            <a
              routerLink="/usuarios"
              routerLinkActive="bg-muted text-foreground font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              class="inline-flex min-h-10 items-center rounded-md px-4 py-2 text-sm text-foreground underline-offset-4 hover:bg-muted hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2"
            >
              Usuários
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <router-outlet />
</div>
